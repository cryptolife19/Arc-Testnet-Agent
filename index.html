<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Testnet AI Agent</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
body{ background:#0d1117; display:flex; justify-content:center; align-items:center; height:100vh; color:white; }
.card{ width:420px; background:#161b22; border:1px solid #30363d; border-radius:15px; padding:30px; text-align:center; }

/* Arc Logo Style */
.title-container { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 8px; }
.arc-logo-box {
    width: 40px;
    height: 40px;
    background-color: #102a56;
    border: 1px solid #1e3a8a;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.arc-logo-box svg { width: 24px; height: 24px; fill: white; }

h1 { font-size: 24px; font-weight: bold; }
p{ color:#9ca3af; margin-bottom:25px; }

/* Action Buttons Container */
.btn-group { display: flex; flex-direction: column; gap: 10px; }
button { width:100%; padding:14px; font-size:16px; border:none; border-radius:8px; cursor:pointer; background:#2563eb; color:white; font-weight:bold; transition: 0.2s; }
button:hover { background:#1d4ed8; }
.disconnect-btn { background: #dc2626; display: none; }
.disconnect-btn:hover { background: #b91c1c; }

.box{ margin-top:18px; padding:14px; background:#0d1117; border:1px solid #30363d; border-radius:8px; word-break:break-all; }
.green{ color:#22c55e; }

/* Modal Box Styling */
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
.modal-content { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; width: 340px; text-align: center; }
.wallet-option { background: #21262d; border: 1px solid #30363d; color: white; padding: 12px; margin-top: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: flex-start; align-items: center; padding-left: 20px; gap: 12px; font-weight: bold; }
.wallet-option:hover { background: #30363d; }
.close-btn { float: right; color: #8b949e; font-size: 20px; cursor: pointer; }

.wallet-icon { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }
</style>
</head>
<body>

<div class="card">
    <div class="title-container">
        <div class="arc-logo-box">
            <svg viewBox="0 0 24 24">
                <path d="M12 4L3 19h4.5l1.8-3h5.4l1.8 3H21L12 4zm0 4.5l2.1 3.5H9.9L12 8.5z"/>
            </svg>
        </div>
        <h1>Arc Testnet AI Agent</h1>
    </div>
    <p>Autonomous Blockchain Agent Dashboard</p>

    <div class="btn-group">
        <button id="connectBtn">Connect Wallet</button>
        <button id="disconnectBtn" class="disconnect-btn">Disconnect</button>
    </div>

    <div class="box">
        Wallet Status<br><br>
        <span id="wallet">Not Connected</span>
    </div>

    <div class="box">
        Network<br><br>
        <span id="network">Unknown</span>
    </div>

    <div class="box">
        Agent Status<br><br>
        <span class="green">● Active</span>
    </div>
</div>

<!-- Modal -->
<div id="walletModal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>
        <h3 style="margin-bottom: 10px;">Select a Wallet</h3>
        <div id="connectMetaMask" class="wallet-option">🦊 MetaMask</div>
        <div id="connectPhantom" class="wallet-option">👻 Phantom</div>
        <div id="connectOKX" class="wallet-option">⬛ OKX Wallet</div>
        <div id="connectBitget" class="wallet-option">
            <svg class="wallet-icon" viewBox="0 0 32 32">
                <rect width="32" height="32" rx="6" fill="#00f0ff"/>
                <path d="M9 11l7 7 7-7H9z" fill="#0d1117"/>
            </svg>
            Bitget Wallet
        </div>
        <div id="connectCoinbase" class="wallet-option">🔵 Coinbase Wallet</div>
        <div id="connectRabby" class="wallet-option">🐰 Rabby Wallet</div>
        <div id="connectGeneric" class="wallet-option">🌐 Other EVM Wallet</div>
    </div>
</div>

<script>
const btn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const modal = document.getElementById("walletModal");
const closeModal = document.getElementById("closeModal");
const wallet = document.getElementById("wallet");
const network = document.getElementById("network");

let currentActiveProvider = null;
const eip6963Providers = new Map();

// 📌 EIP-6963 Provider Discovery
window.addEventListener("eip6963:announceProvider", (event) => {
    const { info, provider } = event.detail;
    eip6963Providers.set(info.rdns, provider);
});
window.dispatchEvent(new Event("eip6963:requestProvider"));

btn.onclick = () => {
    if (btn.innerText === "Connect Wallet") {
        modal.style.display = "flex";
    }
};
closeModal.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

function updateUIConnected(accountAddress, chainId) {
    wallet.innerHTML = accountAddress;
    network.innerHTML = "EVM Chain (ID: " + chainId + ")";
    btn.innerHTML = "Wallet Connected";
    btn.style.background = "#16a34a";
    btn.style.cursor = "default";
    disconnectBtn.style.display = "block";
}

// 📌 1. MetaMask Connector (EIP-6963 First)
document.getElementById("connectMetaMask").onclick = async () => {
    modal.style.display = "none";
    
    // Check EIP-6963 provider for MetaMask first
    let provider = eip6963Providers.get("io.metamask");

    // Fallback if EIP-6963 isn't available
    if (!provider) {
        if (window.ethereum?.providers) {
            provider = window.ethereum.providers.find(p => p.isMetaMask && !p.isPhantom && !p.isBitget);
        } else if (window.ethereum?.isMetaMask) {
            provider = window.ethereum;
        }
    }

    if (!provider) {
        alert("MetaMask extension is not found or enabled!");
        return;
    }

    try {
        currentActiveProvider = provider;
        const accounts = await provider.request({ method: 'eth_requestAccounts' });

        if (!accounts || accounts.length === 0) {
            alert("Please unlock your MetaMask wallet!");
            return;
        }

        const chainId = await provider.request({ method: 'eth_chainId' });
        updateUIConnected(accounts[0], parseInt(chainId, 16));
    } catch (err) {
        alert("MetaMask Connection Error: " + err.message);
    }
};

// Generic Function for Other Wallets
async function connectOtherWallet(provider, walletName) {
    modal.style.display = "none";

    if (!provider) {
        alert(walletName + " extension is not installed!");
        return;
    }

    try {
        currentActiveProvider = provider;
        const accounts = await provider.request({ method: 'eth_requestAccounts' });
        const chainId = await provider.request({ method: 'eth_chainId' });
        
        updateUIConnected(accounts[0], parseInt(chainId, 16));
    } catch (err) {
        alert("Connection failed: " + err.message);
    }
}

// 2. Phantom
document.getElementById("connectPhantom").onclick = () => {
    const provider = eip6963Providers.get("app.phantom") || window.phantom?.ethereum;
    connectOtherWallet(provider, "Phantom");
};

// 3. OKX Wallet
document.getElementById("connectOKX").onclick = () => {
    const provider = eip6963Providers.get("com.okex.wallet") || window.okxwallet;
    connectOtherWallet(provider, "OKX Wallet");
};

// 4. Bitget Wallet
document.getElementById("connectBitget").onclick = () => {
    const provider = eip6963Providers.get("com.bitget.web3") || window.bitkeep?.ethereum || window.bitgetWallet;
    connectOtherWallet(provider, "Bitget Wallet");
};

// 5. Coinbase Wallet
document.getElementById("connectCoinbase").onclick = () => {
    const provider = eip6963Providers.get("com.coinbase.wallet") || window.coinbaseWalletExtension;
    connectOtherWallet(provider, "Coinbase Wallet");
};

// 6. Rabby Wallet
document.getElementById("connectRabby").onclick = () => {
    const provider = eip6963Providers.get("io.rabby") || window.rabby;
    connectOtherWallet(provider, "Rabby Wallet");
};

// 7. Generic EVM Wallet
document.getElementById("connectGeneric").onclick = () => {
    connectOtherWallet(window.ethereum, "EVM Wallet");
};

// Disconnect Logic
disconnectBtn.onclick = async () => {
    if (currentActiveProvider && currentActiveProvider.request) {
        try {
            await currentActiveProvider.request({
                method: "wallet_revokePermissions",
                params: [{ eth_accounts: {} }]
            });
        } catch (err) {
            console.log("Revoke skipped/failed:", err);
        }
    }

    currentActiveProvider = null;
    wallet.innerHTML = "Not Connected";
    network.innerHTML = "Unknown";
    btn.innerHTML = "Connect Wallet";
    btn.style.background = "#2563eb";
    btn.style.cursor = "pointer";
    disconnectBtn.style.display = "none";
};
</script>

</body>
</html>
