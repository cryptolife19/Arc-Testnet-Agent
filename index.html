<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Testnet AI Agent</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
body{ background:#0d1117; display:flex; justify-content:center; align-items:center; height:100vh; color:white; }
.card{ width:420px; background:#161b22; border:1px solid #30363d; border-radius:15px; padding:30px; text-align:center; }
h1{ margin-bottom:10px; }
p{ color:#9ca3af; margin-bottom:25px; }
button{ width:100%; padding:14px; font-size:16px; border:none; border-radius:8px; cursor:pointer; background:#2563eb; color:white; font-weight:bold; }
button:hover{ background:#1d4ed8; }
.box{ margin-top:18px; padding:14px; background:#0d1117; border:1px solid #30363d; border-radius:8px; word-break:break-all; }
.green{ color:#22c55e; }
</style>
</head>
<body>

<div class="card">
    <h1>🤖 Arc Testnet AI Agent</h1>
    <p>Autonomous Blockchain Agent Dashboard</p>

    <button id="connectBtn">Connect MetaMask</button>

    <div class="box">
        Wallet Status<br><br>
        <span id="wallet">Not Connected</span>
    </div>

    <div class="box">
        Network<br><br>
        <span id="network">Unknown</span>
    </div>

    <div class="box">
        Agent Status<br><br>
        <span class="green">● Active</span>
    </div>
</div>

<script>
const btn = document.getElementById("connectBtn");
const wallet = document.getElementById("wallet");
const network = document.getElementById("network");

function getMetaMaskProvider() {
    if (!window.ethereum) return null;
    
    // একাধিক ওয়ালেট থাকলে কেবল মেটামাস্ক প্রোভাইডার নির্বাচন করবে
    if (window.ethereum.providers && window.ethereum.providers.length > 0) {
        return window.ethereum.providers.find(p => p.isMetaMask && !p.isPhantom) || window.ethereum;
    }
    
    return window.ethereum;
}

async function connectWallet() {
    const provider = getMetaMaskProvider();

    if (!provider) {
        alert("MetaMask extension found structure issue or not installed.");
        return;
    }

    try {
        const accounts = await provider.request({ method: 'eth_requestAccounts' });
        const chainId = await provider.request({ method: 'eth_chainId' });

        wallet.innerHTML = accounts[0];
        network.innerHTML = "EVM Chain (ID: " + parseInt(chainId, 16) + ")";
        btn.innerHTML = "Wallet Connected";
        btn.style.background = "#16a34a";
    } catch (error) {
        console.error("MetaMask Connect Error:", error);
        alert(error.message || "Connection failed!");
    }
}

btn.onclick = connectWallet;
</script>

</body>
</html>
