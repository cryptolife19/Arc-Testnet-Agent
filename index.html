<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Testnet AI Agent dApp</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 380px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #2563eb;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background: #334155;
            border-radius: 6px;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🤖 Arc Testnet AI Agent</h2>
    <p>Autonomous Blockchain Agent Dashboard</p>

    <button id="connectBtn" onclick="connectWallet()">Connect MetaMask</button>

    <div class="status" id="walletStatus">
        Wallet Status: Not Connected
    </div>

    <div class="status" id="agentStatus">
        Agent Status: 🟢 Active on GitHub Actions
    </div>
</div>

<script>
    async function connectWallet() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const address = await signer.getAddress();
                
                document.getElementById("walletStatus").innerHTML = 
                    "<strong>Connected Wallet:</strong><br>" + address.substring(0, 6) + "..." + address.substring(address.length - 4);
                document.getElementById("connectBtn").innerText = "Wallet Connected";
                document.getElementById("connectBtn").style.backgroundColor = "#10b981";
            } catch (error) {
                console.error(error);
                alert("Connection Failed!");
            }
        } else {
            alert("MetaMask is not installed. Please install MetaMask!");
        }
    }
</script>

</body>
</html>
