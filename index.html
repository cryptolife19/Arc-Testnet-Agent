<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Testnet AI Agent Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="application/javascript"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        h2 {
            margin-top: 0;
            font-size: 24px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            background-color: #1f6feb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #388bfd;
        }
        .status-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 13px;
            color: #c9d1d9;
            word-break: break-all;
        }
        .dot {
            height: 10px;
            width: 10px;
            background-color: #238636;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤖 Arc Testnet AI Agent</h2>
        <p>Autonomous Blockchain Agent Dashboard</p>

        <button id="connectBtn" class="btn">Connect MetaMask</button>

        <div id="walletStatus" class="status-box">
            Wallet Status: Not Connected
        </div>

        <div class="status-box" style="margin-top: 12px;">
            Agent Status: <span class="dot"></span>Active on GitHub Actions
        </div>
    </div>

    <script>
        document.getElementById("connectBtn").addEventListener("click", async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // Ethers.js provider ইনিশিয়ালাইজেশন
                    const provider = new ethers.providers.Web3Provider(window.ethereum, "any");
                    
                    // অ্যাকাউন্ট এক্সেস চাওয়া
                    await provider.send("eth_requestAccounts", []);
                    
                    const signer = provider.getSigner();
                    const address = await signer.getAddress();

                    // ওয়ালেট যুক্ত হলে ইউআই আপডেট
                    document.getElementById("walletStatus").innerHTML = 
                        "<strong>Connected Wallet:</strong><br>" + address;
                    document.getElementById("connectBtn").innerText = "Wallet Connected";
                    document.getElementById("connectBtn").style.backgroundColor = "#238636";
                } catch (error) {
                    console.error("MetaMask Error:", error);
                    alert("স্বয়ংক্রিয় কানেকশন ফেল করেছে! অনুগ্রহ করে আপনার MetaMask এক্সটেনশনে গিয়ে ওপরের নেটওয়ার্কটি 'Solana' থেকে বদলে 'Ethereum Mainnet' বা যেকোনো EVM নেটওয়ার্ক সিলেক্ট করে আবার চেষ্টা করুন।");
                }
            } else {
                alert("আপনার ব্রাউজারে MetaMask এক্সটেনশনটি ইনস্টল করা নেই!");
            }
        });
    </script>

</body>
</html>
