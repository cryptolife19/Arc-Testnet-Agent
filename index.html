<script>
const btn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const modal = document.getElementById("walletModal");
const closeModal = document.getElementById("closeModal");
const wallet = document.getElementById("wallet");
const network = document.getElementById("network");

let currentActiveProvider = null;

btn.onclick = () => {
    if (btn.innerText === "Connect Wallet") {
        modal.style.display = "flex";
    }
};
closeModal.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

// UI Update Function
function updateUIConnected(accountAddress, chainId) {
    wallet.innerHTML = accountAddress;
    network.innerHTML = "EVM Chain (ID: " + chainId + ")";
    btn.innerHTML = "Wallet Connected";
    btn.style.background = "#16a34a";
    btn.style.cursor = "default";
    disconnectBtn.style.display = "block";
}

// 1. MetaMask Special Bulletproof Logic
document.getElementById("connectMetaMask").onclick = async () => {
    modal.style.display = "none";
    let provider = window.ethereum;

    // Filter out MetaMask specifically if multiple providers exist
    if (window.ethereum?.providers) {
        provider = window.ethereum.providers.find(p => p.isMetaMask && !p.isPhantom && !p.isBitget) || window.ethereum;
    }

    if (!provider) {
        alert("MetaMask extension is not installed!");
        return;
    }

    try {
        currentActiveProvider = provider;

        // Direct accounts request without permissions method wrapper to avoid 'must have at least one account' error
        const accounts = await provider.request({ method: 'eth_requestAccounts' });

        if (!accounts || accounts.length === 0) {
            alert("Please unlock MetaMask and select an account!");
            return;
        }

        const chainId = await provider.request({ method: 'eth_chainId' });
        updateUIConnected(accounts[0], parseInt(chainId, 16));
    } catch (err) {
        if (err.code === -32002) {
            alert("MetaMask popup is already open. Please check your browser extension bar!");
        } else {
            alert("MetaMask Connection Error: " + err.message);
        }
    }
};

// Generic Function for Other Wallets
async function connectOtherWallet(provider, walletName) {
    modal.style.display = "none";

    if (!provider) {
        alert(walletName + " extension is not installed!");
        return;
    }

    try {
        currentActiveProvider = provider;
        const accounts = await provider.request({ method: 'eth_requestAccounts' });
        const chainId = await provider.request({ method: 'eth_chainId' });
        
        updateUIConnected(accounts[0], parseInt(chainId, 16));
    } catch (err) {
        alert("Connection failed: " + err.message);
    }
}

// 2. Phantom
document.getElementById("connectPhantom").onclick = () => {
    connectOtherWallet(window.phantom?.ethereum, "Phantom");
};

// 3. OKX Wallet
document.getElementById("connectOKX").onclick = () => {
    connectOtherWallet(window.okxwallet, "OKX Wallet");
};

// 4. Bitget Wallet
document.getElementById("connectBitget").onclick = () => {
    const provider = window.bitkeep?.ethereum || window.bitgetWallet;
    connectOtherWallet(provider, "Bitget Wallet");
};

// 5. Coinbase Wallet
document.getElementById("connectCoinbase").onclick = () => {
    connectOtherWallet(window.coinbaseWalletExtension, "Coinbase Wallet");
};

// 6. Rabby Wallet
document.getElementById("connectRabby").onclick = () => {
    connectOtherWallet(window.rabby, "Rabby Wallet");
};

// 7. Generic EVM Wallet
document.getElementById("connectGeneric").onclick = () => {
    connectOtherWallet(window.ethereum, "EVM Wallet");
};

// Disconnect Logic
disconnectBtn.onclick = async () => {
    if (currentActiveProvider && currentActiveProvider.request) {
        try {
            await currentActiveProvider.request({
                method: "wallet_revokePermissions",
                params: [{ eth_accounts: {} }]
            });
        } catch (err) {
            console.log("Revoke failed/skipped:", err);
        }
    }

    currentActiveProvider = null;
    wallet.innerHTML = "Not Connected";
    network.innerHTML = "Unknown";
    btn.innerHTML = "Connect Wallet";
    btn.style.background = "#2563eb";
    btn.style.cursor = "pointer";
    disconnectBtn.style.display = "none";
};
</script>
