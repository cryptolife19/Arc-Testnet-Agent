<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Testnet AI Agent Dashboard</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        h2 { margin-top: 0; font-size: 24px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
        .btn {
            background-color: #1f6feb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #388bfd; }
        .status-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 13px;
            color: #c9d1d9;
            word-break: break-all;
        }
        .dot {
            height: 10px;
            width: 10px;
            background-color: #238636;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤖 Arc Testnet AI Agent</h2>
        <p>Autonomous Blockchain Agent Dashboard</p>

        <button id="connectBtn" class="btn">Connect Wallet</button>

        <div id="walletStatus" class="status-box">
            Wallet Status: Not Connected
        </div>

        <div class="status-box" style="margin-top: 12px;">
            Agent Status: <span class="dot"></span>Active on GitHub Actions
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById("connectBtn");
        const walletStatus = document.getElementById("walletStatus");

        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert("MetaMask extension is not installed!");
                return;
            }

            try {
                // ১. সরাসরি একাউন্ট পারমিশন চাওয়া
                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });

                if (accounts && accounts.length > 0) {
                    const address = accounts[0];
                    walletStatus.innerHTML = "<strong>Connected:</strong><br>" + address;
                    connectBtn.innerText = "Wallet Connected";
                    connectBtn.style.backgroundColor = "#238636";
                }
            } catch (error) {
                console.error("Connection error:", error);
                
                // যদি ব্যাকগ্রাউন্ডে পেন্ডিং থাকে
                if (error.code === -32002) {
                    alert("A connection request is already pending. Please open your MetaMask extension icon at the top right to approve it!");
                } else {
                    alert("Connection failed! Please make sure MetaMask is unlocked and set to Ethereum Mainnet.");
                }
            }
        }

        connectBtn.addEventListener("click", connectWallet);
    </script>

</body>
</html>
