<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Testnet AI Agent</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
body{ background:#0d1117; display:flex; justify-content:center; align-items:center; height:100vh; color:white; }
.card{ width:420px; background:#161b22; border:1px solid #30363d; border-radius:15px; padding:30px; text-align:center; }

/* Arc Logo Custom Style */
.title-container { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 8px; }
.arc-logo-box {
    width: 40px;
    height: 40px;
    background-color: #102a56;
    border: 1px solid #1e3a8a;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.arc-logo-box svg {
    width: 24px;
    height: 24px;
    fill: white;
}

h1 { font-size: 24px; font-weight: bold; }
p{ color:#9ca3af; margin-bottom:25px; }
button{ width:100%; padding:14px; font-size:16px; border:none; border-radius:8px; cursor:pointer; background:#2563eb; color:white; font-weight:bold; }
button:hover{ background:#1d4ed8; }
.box{ margin-top:18px; padding:14px; background:#0d1117; border:1px solid #30363d; border-radius:8px; word-break:break-all; }
.green{ color:#22c55e; }

/* Modal Box Styling */
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
.modal-content { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; width: 320px; text-align: center; }
.wallet-option { background: #21262d; border: 1px solid #30363d; color: white; padding: 12px; margin-top: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; font-weight: bold; }
.wallet-option:hover { background: #30363d; }
.close-btn { float: right; color: #8b949e; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>

<div class="card">
    <div class="title-container">
        <!-- Exact Arc 'A' Icon Vector -->
        <div class="arc-logo-box">
            <svg viewBox="0 0 24 24">
                <path d="M12 4L3 19h4.5l1.8-3h5.4l1.8 3H21L12 4zm0 4.5l2.1 3.5H9.9L12 8.5z"/>
            </svg>
        </div>
        <h1>Arc Testnet AI Agent</h1>
    </div>
    <p>Autonomous Blockchain Agent Dashboard</p>

    <button id="connectBtn">Connect Wallet</button>

    <div class="box">
        Wallet Status<br><br>
        <span id="wallet">Not Connected</span>
    </div>

    <div class="box">
        Network<br><br>
        <span id="network">Unknown</span>
    </div>

    <div class="box">
        Agent Status<br><br>
        <span class="green">● Active</span>
    </div>
</div>

<!-- Wallet Selection Modal -->
<div id="walletModal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>
        <h3>Select a Wallet</h3>
        <div id="connectMetaMask" class="wallet-option">🦊 MetaMask</div>
        <div id="connectPhantom" class="wallet-option">👻 Phantom / Other</div>
    </div>
</div>

<script>
const btn = document.getElementById("connectBtn");
const modal = document.getElementById("walletModal");
const closeModal = document.getElementById("closeModal");
const wallet = document.getElementById("wallet");
const network = document.getElementById("network");

btn.onclick = () => modal.style.display = "flex";
closeModal.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

document.getElementById("connectMetaMask").onclick = async () => {
    modal.style.display = "none";
    let provider = window.ethereum;

    if (window.ethereum?.providers) {
        provider = window.ethereum.providers.find(p => p.isMetaMask && !p.isPhantom) || window.ethereum;
    }

    if (!provider) {
        alert("MetaMask is not installed!");
        return;
    }

    try {
        const accounts = await provider.request({ method: 'eth_requestAccounts' });
        const chainId = await provider.request({ method: 'eth_chainId' });
        updateUI(accounts[0], parseInt(chainId, 16));
    } catch (err) {
        alert("Connection failed: " + err.message);
    }
};

document.getElementById("connectPhantom").onclick = async () => {
    modal.style.display = "none";
    const provider = window.phantom?.ethereum || window.ethereum;

    if (!provider) {
        alert("Phantom / Web3 Wallet is not installed!");
        return;
    }

    try {
        const accounts = await provider.request({ method: 'eth_requestAccounts' });
        const chainId = await provider.request({ method: 'eth_chainId' });
        updateUI(accounts[0], parseInt(chainId, 16));
    } catch (err) {
        alert("Connection failed: " + err.message);
    }
};

function updateUI(accountAddress, chainId) {
    wallet.innerHTML = accountAddress;
    network.innerHTML = "EVM Chain (ID: " + chainId + ")";
    btn.innerHTML = "Wallet Connected";
    btn.style.background = "#16a34a";
}
</script>

</body>
</html>
