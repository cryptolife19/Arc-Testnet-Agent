<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Testnet AI Agent dApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 380px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            background: #334155;
            border-radius: 6px;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🤖 Arc Testnet AI Agent</h2>
    <p>Autonomous Blockchain Agent Dashboard</p>

    <button id="connectBtn" onclick="connectWallet()">Connect MetaMask</button>

    <div class="status" id="walletStatus">
        Wallet Status: Not Connected
    </div>

    <div class="status" id="agentStatus">
        Agent Status: 🟢 Active on GitHub Actions
    </div>
</div>

<script>
    document.getElementById("connectBtn").addEventListener("click", async () => {
        if (typeof window.ethereum !== 'undefined') {
            try {
                // ১. পারমিশন পপআপকে ফোর্স করা (যাতে Solana তে থাকলেও MetaMask EVM অ্যাকাউন্ট পপআপ দেখায়)
                await window.ethereum.request({
                    method: 'wallet_requestPermissions',
                    params: [{ eth_accounts: {} }]
                });

                // ২. অ্যাকাউন্ট এড্রেস রিড করা
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const address = accounts[0];

                document.getElementById("walletStatus").innerHTML = 
                    "<strong>Connected Wallet:</strong><br>" + address.substring(0, 6) + "..." + address.substring(address.length - 4);
                document.getElementById("connectBtn").innerText = "Wallet Connected";
                document.getElementById("connectBtn").style.backgroundColor = "#10b981";
            } catch (error) {
                console.error("MetaMask Connection Error:", error);
                
                // যদি ব্যবহারকারী ক্যানসেল করে বা ম্যানুয়ালি সুইচ করতে হয়
                if (error.code === 4001) {
                    alert("Connection request was rejected.");
                } else {
                    alert("Connection Failed! Please open MetaMask and manually change the top network from 'Solana' to 'Ethereum Mainnet'.");
                }
            }
        } else {
            alert("MetaMask extension is not installed!");
        }
    });
</script>

</body>
</html>
